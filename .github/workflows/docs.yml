name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [mainnet]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: 'gh-app'
        name: 'Get Token'
        uses: 'tibdex/github-app-token@3beb63f4bd073e61482598c45c71c1019b59b73a' #v1.7.0
        with:
          app_id: ${{ secrets.GH_APP_ID }}
          private_key: ${{ secrets.GH_PRIVATE_KEY }}

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2
        with:
          submodules: recursive
          token: ${{ steps.gh-app.outputs.token }}

      # Use the generated GitHub App token to authenticate git
      - name: Set up Git for token-based access
        run: |
          git config --global url."https://x-access-token:${{ steps.gh-app.outputs.token }}@github.com/".insteadOf "git@github.com:"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
            version: stable

      - name: Update package
        run: forge soldeer update

      - name: Run Forge build
        run: |
          forge --version
          forge build
        id: build

      - name: Build docs
        run: forge doc --build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
